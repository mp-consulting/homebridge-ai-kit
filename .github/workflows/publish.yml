name: Publish

on:
  release:
    types: [published]
  # Re-runs a release that is already tagged with this workflow file, e.g. to attach the
  # extension after a fix here. Steps already done (npm versions) are skipped.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v3.1.1
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Never publish a release that fails its own tests.
      - name: Test
        run: npm test

      # ai-kit depends on ai-core, so ai-core goes first. Skipped when this
      # ai-core version is already on npm (an ai-kit-only release).
      # Both packages need npm trusted publishing (OIDC) configured for this workflow.
      - name: Publish @mp-consulting/homebridge-ai-core
        run: |
          VERSION=$(node -p "require('./packages/ai-core/package.json').version")
          if npm view "@mp-consulting/homebridge-ai-core@$VERSION" version >/dev/null 2>&1; then
            echo "@mp-consulting/homebridge-ai-core@$VERSION is already published, skipping."
          else
            npm publish -w packages/ai-core --provenance --access public
          fi

      # Also skipped when already on npm, e.g. a release created for a version
      # that was first published by hand (2.0.0).
      - name: Publish @mp-consulting/homebridge-ai-kit
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@mp-consulting/homebridge-ai-kit@$VERSION" version >/dev/null 2>&1; then
            echo "@mp-consulting/homebridge-ai-kit@$VERSION is already published, skipping."
          else
            npm publish --provenance --access public
          fi

  # After npm: builds the Claude app extension (homebridge-ai-kit-<version>.mcpb), attaches it to
  # the release, and lists the version in the MCP registry (whose npm entry needs the package on npm).
  extension:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # MCP registry login (GitHub OIDC)
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # The extension is signed for Claude only when a Developer ID certificate is set.
      SIGN: ${{ secrets.DEVELOPER_ID_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Make Claude extension
        run: |
          MCPB="$RUNNER_TEMP/homebridge-ai-kit-${TAG#v}.mcpb"
          scripts/make-mcpb.sh "$MCPB"
          echo "MCPB=$MCPB" >> "$GITHUB_ENV"

      # Signs the bundle with the Developer ID certificate and Apple's intermediates, so Claude
      # shows a verified publisher.
      - name: Sign Claude extension
        if: env.SIGN == 'true'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          WORK="$RUNNER_TEMP/mcpb-sign"
          mkdir -p "$WORK"
          trap 'rm -rf "$WORK"' EXIT
          (umask 077 && echo "$CERTIFICATE" | base64 --decode > "$WORK/id.p12")
          pem() {
            openssl pkcs12 -in "$WORK/id.p12" -passin env:CERTIFICATE_PASSWORD "$@" 2>/dev/null \
              || openssl pkcs12 -legacy -in "$WORK/id.p12" -passin env:CERTIFICATE_PASSWORD "$@"
          }
          (umask 077 && pem -nocerts -nodes -out "$WORK/key.pem")
          pem -clcerts -nokeys -out "$WORK/cert.pem"
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$WORK/$ca.cer"
            openssl x509 -inform DER -in "$WORK/$ca.cer" -out "$WORK/$ca.pem"
          done
          npx --yes @anthropic-ai/mcpb@2.1.2 sign "$MCPB" --cert "$WORK/cert.pem" --key "$WORK/key.pem" \
            --intermediate "$WORK/DeveloperIDG2CA.pem" "$WORK/DeveloperIDCA.pem"

      # `mcpb verify` cannot pass on Linux: it checks the chain with
      # `openssl verify -purpose codesigning -CApath /etc/ssl/certs`, a purpose the runner's
      # OpenSSL 3.0 does not know, against a store without Apple's root, and so reports every
      # Developer ID signature as unsigned. This checks the same things: the PKCS#7 signature
      # over the bundle, its chain to Apple Root CA, and a code-signing certificate.
      # -ignore_critical: Developer ID certificates carry Apple's critical marker extension
      # (1.2.840.113635.100.6.1.13), which OpenSSL does not know and would otherwise reject.
      - name: Verify Claude extension signature
        if: env.SIGN == 'true'
        run: |
          WORK="$RUNNER_TEMP/mcpb-verify"
          mkdir -p "$WORK"
          python3 - "$MCPB" "$WORK" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          end = data.rindex(b"MCPB_SIG_END")
          start = data.rindex(b"MCPB_SIG_V1", 0, end)
          size = struct.unpack_from("<I", data, start + 11)[0]
          open(sys.argv[2] + "/content.bin", "wb").write(data[:start])
          open(sys.argv[2] + "/signature.der", "wb").write(data[start + 15:start + 15 + size])
          PY
          curl -fsSL https://www.apple.com/appleca/AppleIncRootCertificate.cer -o "$WORK/root.cer"
          openssl x509 -inform DER -in "$WORK/root.cer" -out "$WORK/root.pem"
          openssl cms -verify -binary -inform DER -in "$WORK/signature.der" -content "$WORK/content.bin" \
            -CAfile "$WORK/root.pem" -purpose any -ignore_critical -out /dev/null
          openssl pkcs7 -inform DER -in "$WORK/signature.der" -print_certs \
            | openssl x509 -noout -subject -ext extendedKeyUsage | tee /dev/stderr | grep -q 'Code Signing'

      - name: Attach Claude extension
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$MCPB" --clobber

      - name: Publish to the MCP registry
        run: |
          VERSION="${TAG#v}"
          SHA256="$(sha256sum "$MCPB" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/$VERSION/g" -e "s/__SHA256__/$SHA256/" server.json > "$RUNNER_TEMP/server.json"
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
