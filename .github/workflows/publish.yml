name: Publish to npm

# Only for the final @mp-consulting/homebridge-mcp-server 1.3.0 shim (branch legacy/1.3.0).
# Publish @mp-consulting/homebridge-ai-kit 2.0.0 first: this package depends on it.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: legacy/1.3.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: npm publish --provenance --access public
